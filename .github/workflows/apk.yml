name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch proot binaries (Termux packages)
        run: bash scripts/fetch-proot.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: APK report
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -l "$APK"
          {
            echo "## APK report"
            echo ""
            echo "- APK size: $(du -h "$APK" | cut -f1)"
            echo "- Native libraries inside the APK:"
            unzip -l "$APK" | grep -E 'lib/arm64-v8a' | sed 's/^/  - /' || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalPDF-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to release apk-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk-latest >/dev/null 2>&1 || gh release create apk-latest --prerelease --title "Latest APK" --notes "Latest debug build"
          gh release upload apk-latest app/build/outputs/apk/debug/app-debug.apk --clobber

name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-build
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore or create the stable signing keystore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          NAMES="$(gh release view apk-latest --json assets --jq '.assets[].name' 2>/dev/null || true)"
          case "$NAMES" in
            *debug.keystore*)
              gh release download apk-latest -p debug.keystore -D "$HOME/.android" --clobber
              echo "Restored the stored keystore"
              ;;
            *)
              echo "No stored keystore found, creating one"
              keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
              gh release view apk-latest >/dev/null 2>&1 || gh release create apk-latest --prerelease --title "Latest APK" --notes "Latest debug build"
              gh release upload apk-latest "$HOME/.android/debug.keystore" --clobber
              ;;
          esac
          test -s "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android 2>/dev/null | grep -E "Alias name|SHA256" || true

      - name: Fetch proot binaries (Termux packages)
        run: bash scripts/fetch-proot.sh

      - name: Build memory probe (static glibc arm64)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          aarch64-linux-gnu-gcc -O2 -static -o app/src/main/jniLibs/arm64-v8a/libmprobe.so scripts/mprobe.c
          ls -l app/src/main/jniLibs/arm64-v8a

      - name: Set up QEMU (arm64)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build musl probe and mprotect shim (Alpine arm64)
        run: |
          set -euo pipefail
          docker run --rm --platform linux/arm64 -v "$PWD":/w alpine:3.21 sh -c '
            apk add --no-cache gcc musl-dev >/dev/null &&
            gcc -O2 -static -o /w/app/src/main/jniLibs/arm64-v8a/libmprobe_musl.so /w/scripts/mprobe.c &&
            gcc -O2 -shared -fPIC -o /w/app/src/main/jniLibs/arm64-v8a/libmpshim.so /w/scripts/mpshim.c
          '
          ls -l app/src/main/jniLibs/arm64-v8a

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: |
          export LOCALPDF_KEYSTORE="$HOME/.android/debug.keystore"
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: APK report
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER="$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          {
            echo "## APK report"
            echo ""
            echo "- app-debug.apk: $(du -h "$APK" | cut -f1)"
            "$APKSIGNER" verify --print-certs "$APK" 2>/dev/null | grep -i "SHA-256" | sed 's/^/- Signer /' || true
            echo ""
            echo "Compare the first 32 characters with the Signer line shown inside the app."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish APK to release apk-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk-latest >/dev/null 2>&1 || gh release create apk-latest --prerelease --title "Latest APK" --notes "Latest debug build"
          gh release delete-asset apk-latest app-modern-debug.apk -y 2>/dev/null || true
          gh release delete-asset apk-latest app-legacy-debug.apk -y 2>/dev/null || true
          gh release upload apk-latest app/build/outputs/apk/debug/app-debug.apk --clobber

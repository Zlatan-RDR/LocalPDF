name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-build
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore or create stable debug keystore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          if gh release download apk-latest -p debug.keystore -D ~/.android --clobber 2>/dev/null; then
            echo "Restored the stored debug keystore"
          else
            echo "Creating a new debug keystore"
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            gh release view apk-latest >/dev/null 2>&1 || gh release create apk-latest --prerelease --title "Latest APK" --notes "Latest debug build"
            gh release upload apk-latest ~/.android/debug.keystore --clobber
          fi

      - name: Fetch proot binaries (Termux packages)
        run: bash scripts/fetch-proot.sh

      - name: Build memory probe (static arm64)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          aarch64-linux-gnu-gcc -O2 -static -o app/src/main/jniLibs/arm64-v8a/libmprobe.so scripts/mprobe.c
          ls -l app/src/main/jniLibs/arm64-v8a

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APKs
        run: gradle :app:assembleModernDebug :app:assembleLegacyDebug --no-daemon --stacktrace

      - name: APK report
        run: |
          APKSIGNER="$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          {
            echo "## APK report"
            echo ""
            echo "Keystore fingerprint:"
            keytool -list -v -keystore ~/.android/debug.keystore -storepass android 2>/dev/null | grep "SHA256:" | sed 's/^/  - /' || true
            echo ""
            for f in app/build/outputs/apk/modern/debug/app-modern-debug.apk app/build/outputs/apk/legacy/debug/app-legacy-debug.apk; do
              echo "- $(basename "$f"): $(du -h "$f" | cut -f1)"
              "$APKSIGNER" verify --print-certs "$f" 2>/dev/null | grep -i "SHA-256" | sed 's/^/  - /' || true
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish APKs to release apk-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk-latest >/dev/null 2>&1 || gh release create apk-latest --prerelease --title "Latest APK" --notes "Latest debug build"
          gh release delete-asset apk-latest app-debug.apk -y 2>/dev/null || true
          gh release upload apk-latest app/build/outputs/apk/modern/debug/app-modern-debug.apk app/build/outputs/apk/legacy/debug/app-legacy-debug.apk --clobber

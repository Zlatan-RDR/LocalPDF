name: Build runtime packs

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag that will hold the packs"
        required: true
        default: "packs-v1"
  push:
    branches: [ main ]
    paths:
      - "rootfs/Dockerfile"

concurrency:
  group: build-runtime-packs
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  packs:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (arm64)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download Stirling-PDF server jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p out
          TAG="$(gh api repos/Stirling-Tools/Stirling-PDF/releases/latest --jq .tag_name)"
          echo "STIRLING_TAG=$TAG" >> "$GITHUB_ENV"
          URL="https://github.com/Stirling-Tools/Stirling-PDF/releases/download/$TAG/Stirling-PDF-server.jar"
          if ! curl -fL --retry 3 -o out/stirling-server.jar "$URL"; then
            echo "Download failed. Assets available in release $TAG:"
            gh release view "$TAG" -R Stirling-Tools/Stirling-PDF --json assets --jq '.assets[].name'
            exit 1
          fi
          unzip -tq out/stirling-server.jar
          ls -l out

      - name: Inspect the jar (native libraries and platforms)
        run: |
          set -euo pipefail
          {
            echo "## Jar inspection"
            echo ""
            echo "Entries that mention jpdfium, native libraries or platforms:"
            echo ""
            unzip -Z1 out/stirling-server.jar | grep -i -E 'jpdfium|\.so($|\.)|linux-' | head -n 80 | sed 's/^/- /' || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch JPDFium linux-arm64 natives
        run: |
          set -uo pipefail
          mkdir -p rootfs/natives
          rm -f rootfs/natives/*.jar
          {
            echo ""
            echo "## JPDFium arm64 natives"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          VER="$(unzip -Z1 out/stirling-server.jar | grep -oE 'BOOT-INF/lib/jpdfium-[0-9][^/]*\.jar' | head -n 1 | sed -E 's#BOOT-INF/lib/jpdfium-(.*)\.jar#\1#')"
          if [ -z "$VER" ]; then
            echo "- FAILED: could not read the jpdfium version from the jar" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "- jpdfium version in the server jar: $VER" >> "$GITHUB_STEP_SUMMARY"
          NAME="jpdfium-natives-linux-arm64-$VER.jar"
          OK=0
          for BASE in \
            "https://repo1.maven.org/maven2/com/stirling/jpdfium-natives-linux-arm64/$VER" \
            "https://maven.stirlingpdf.com/com/stirling/jpdfium-natives-linux-arm64/$VER"; do
            if curl -fsSL --retry 3 -o "rootfs/natives/$NAME" "$BASE/$NAME" && unzip -tq "rootfs/natives/$NAME" >/dev/null 2>&1; then
              echo "- OK: $NAME downloaded from $BASE" >> "$GITHUB_STEP_SUMMARY"
              OK=1
              break
            fi
            rm -f "rootfs/natives/$NAME"
            echo "- not available: $BASE/$NAME" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "$OK" = "1" ]; then
            {
              echo ""
              echo "Contents of $NAME (first 40 entries):"
              echo ""
              unzip -Z1 "rootfs/natives/$NAME" | head -n 40 | sed 's/^/- /'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- FAILED: no linux-arm64 natives jar found for version $VER. The pack is built without it." >> "$GITHUB_STEP_SUMMARY"
          fi
          ls -l rootfs/natives

      - name: Build core, tools and office rootfs
        run: |
          set -euo pipefail
          docker buildx build --platform linux/arm64 --target core -f rootfs/Dockerfile --output type=tar,dest=out/core.tar rootfs
          docker buildx build --platform linux/arm64 --target tools -f rootfs/Dockerfile --output type=tar,dest=out/tools-full.tar rootfs
          docker buildx build --platform linux/arm64 --target office -f rootfs/Dockerfile --output type=tar,dest=out/office-full.tar rootfs
          python3 scripts/make_delta2.py out/core.tar out/tools-full.tar out/tools.tar
          python3 scripts/make_delta2.py out/tools-full.tar out/office-full.tar out/office.tar
          rm -f out/tools-full.tar out/office-full.tar
          ls -l out

      - name: Compress packs (xz)
        run: |
          set -euo pipefail
          xz -T0 -9 -k out/core.tar
          xz -T0 -9 -k out/tools.tar
          xz -T0 -9 -k out/office.tar
          ls -l out

      - name: Size report and manifest
        run: python3 scripts/pack_manifest.py out "$STIRLING_TAG" core tools office

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || 'packs-v1' }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --title "Runtime packs $RELEASE_TAG" --notes "Runtime packs for LocalPDF"
          gh release upload "$RELEASE_TAG" out/core.tar.xz out/tools.tar.xz out/office.tar.xz out/stirling-server.jar out/manifest.json --clobber
